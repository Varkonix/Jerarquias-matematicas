<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="512" height="256" rx="110" fill="url(#glowGrad)"/>
  
  <!-- Mathematical symbols / Hierarchy badge -->
  <g filter="url(#shadow)">
    <!-- Main Center Badge -->
    <rect x="76" y="86" width="360" height="340" rx="36" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3"/>
    
    <!-- Parentheses () -->
    <path d="M140 160 C 110 210, 110 302, 140 352" stroke="#38bdf8" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M372 160 C 402 210, 402 302, 372 352" stroke="#38bdf8" stroke-width="26" stroke-linecap="round" fill="none"/>
    
    <!-- Multiply & Divide in Top Row -->
    <!-- Multiply × -->
    <path d="M190 190 L240 240 M240 190 L190 240" stroke="#f43f5e" stroke-width="22" stroke-linecap="round"/>
    <!-- Divide ÷ -->
    <path d="M272 215 L322 215" stroke="#fbbf24" stroke-width="22" stroke-linecap="round"/>
    <circle cx="297" cy="188" r="8" fill="#fbbf24"/>
    <circle cx="297" cy="242" r="8" fill="#fbbf24"/>
    
    <!-- Plus & Minus in Bottom Row -->
    <!-- Plus + -->
    <path d="M215 285 L215 335 M190 310 L240 310" stroke="#10b981" stroke-width="22" stroke-linecap="round"/>
    <!-- Minus - -->
    <path d="M275 310 L325 310" stroke="#a855f7" stroke-width="22" stroke-linecap="round"/>
  </g>
  
  <!-- Tiny flame for streak icon -->
  <path d="M256 95 C250 115 235 130 245 150 C230 145 220 130 220 120 C210 135 210 155 225 170 C240 185 272 185 287 170 C302 155 300 130 280 115 C280 125 270 135 260 130 C265 118 265 105 256 95 Z" fill="#f59e0b" filter="url(#shadow)"/>
</svg>
